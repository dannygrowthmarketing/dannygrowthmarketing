uot;, 9 leads</text><text x="476.6666666666667" y="208" fill="#A8B0C4" font-size="13">Google said: conversions</text><rect x="476.6666666666667" y="215" width="268" height="14" rx="4" fill="#FF7376"/><text x="753" y="228" fill="#F3F1EC" font-size="15" font-weight="800">55</text><text x="476.6666666666667" y="252" fill="#A8B0C4" font-size="13">Of those, map taps</text><rect x="476.6666666666667" y="259" width="253" height="14" rx="4" fill="#FF7376"/><text x="738" y="272" fill="#F3F1EC" font-size="15" font-weight="800">52</text><text x="476.6666666666667" y="296" fill="#A8B0C4" font-size="13">Real leads (calls + WhatsApp)</text><rect x="476.6666666666667" y="303" width="44" height="14" rx="4" fill="#1FA571"/><text x="528" y="316" fill="#F3F1EC" font-size="15" font-weight="800">≈ 9</text><text x="476.6666666666667" y="348" fill="#A8B0C4" font-size="13.5">≈₹580 per real lead, not ₹95.</text><text x="476.6666666666667" y="368" fill="#6B7590" font-size="12.5">Fixed 17 Oct: 10 ad groups, 49 negatives, PMax.</text><rect x="845.3333333333334" y="116" width="370.6666666666667" height="270" rx="18" fill="#131B33" stroke="#222C47"/><text x="867.3333333333334" y="150" fill="#FF7376" font-size="12.5" font-weight="800" letter-spacing="2">TONI&amp;GUY BENGALURU · NEW</text><text x="867.3333333333334" y="178" fill="#F3F1EC" font-size="19" font-weight="800">Two salons from zero</text><circle cx="1030.6666666666667" cy="256" r="12.8" fill="none" stroke="#2A3658" stroke-dasharray="3 4"/><circle cx="1030.6666666666667" cy="256" r="38.4" fill="none" stroke="#2A3658" stroke-dasharray="3 4"/><circle cx="1030.6666666666667" cy="256" r="64.0" fill="none" stroke="#2A3658" stroke-dasharray="3 4"/><circle cx="1029.5" cy="277.1" r="5.7" fill="#3987e5" fill-opacity=".85" stroke="#131B33" stroke-width="1"/><circle cx="1018.4" cy="267.4" r="5.3" fill="#3987e5" fill-opacity=".85" stroke="#131B33" stroke-width="1"/><circle cx="1052.3" cy="275.3" r="5.2" fill="#3987e5" fill-opacity=".85" stroke="#131B