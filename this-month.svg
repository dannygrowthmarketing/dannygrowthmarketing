<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" width="1280" height="430" role="img" aria-label="This month: only 24% of a resort's 1,737 callers reached its CRM; Meta lead forms booked 2% vs phone enquiries 21%; 203 dental patients due for a check-up now on a WhatsApp recall list"><rect width="1280" height="430" rx="24" fill="#0C1222"/><g font-family="Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif"><text x="64" y="62" fill="#F3F1EC" font-size="26" font-weight="800">This month, in three numbers</text><text x="64" y="90" fill="#A8B0C4" font-size="15">Live work, Oct–Nov 2026. Found by matching two data sources side by side.</text><rect x="64.0" y="116" width="370.6666666666667" height="270" rx="18" fill="#131B33" stroke="#222C47"/><text x="86.0" y="150" fill="#FF6A6E" font-size="12.5" font-weight="800" letter-spacing="2">GOLD COINS · CALLS + CRM</text><text x="86.0" y="178" fill="#F3F1EC" font-size="19" font-weight="800">Callers who reach the CRM</text><text x="86.0" y="212" fill="#A8B0C4" font-size="13">Called in October</text><rect x="86.0" y="220" width="221" height="16" rx="4" fill="#7B6FE0"/><text x="315" y="234" fill="#F3F1EC" font-size="16" font-weight="800">1,737</text><text x="86.0" y="270" fill="#A8B0C4" font-size="13">Have a CRM record</text><rect x="86.0" y="278" width="54" height="16" rx="4" fill="#FF6A6E"/><text x="148" y="292" fill="#F3F1EC" font-size="16" font-weight="800">425</text><text x="86.0" y="342" fill="#A8B0C4" font-size="13.5">24% logged. 737 never got through.</text><text x="86.0" y="364" fill="#6B7590" font-size="12.5">Fix: same-day callbacks, every call logged.</text><rect x="454.6666666666667" y="116" width="370.6666666666667" height="270" rx="18" fill="#131B33" stroke="#222C47"/><text x="476.6666666666667" y="150" fill="#F0B53A" font-size="12.5" font-weight="800" letter-spacing="2">GOLD COINS · META + CRM</text><text x="476.6666666666667" y="178" fill="#F3F1EC" font-size="19" font-weight="800">Lead forms vs phone calls</text><text x="476.6666666666667" y="212" fill="#A8B0C4" font-size="13">Meta forms booked</text><rect x="476.6666666666667" y="220" width="21" height="16" rx="4" fill="#F0B53A"/><text x="506" y="234" fill="#F3F1EC" font-size="16" font-weight="800">2%</text><text x="476.6666666666667" y="270" fill="#A8B0C4" font-size="13">Phone enquiries booked</text><rect x="476.6666666666667" y="278" width="221" height="16" rx="4" fill="#1FA571"/><text x="705" y="292" fill="#F3F1EC" font-size="16" font-weight="800">21%</text><text x="476.6666666666667" y="342" fill="#A8B0C4" font-size="13.5">4 of 216 vs 91 of 430, same month.</text><text x="476.6666666666667" y="364" fill="#6B7590" font-size="12.5">Fix: budget to click-to-WhatsApp and Search.</text><rect x="845.3333333333334" y="116" width="370.6666666666667" height="270" rx="18" fill="#131B33" stroke="#222C47"/><text x="867.3333333333334" y="150" fill="#3BE09A" font-size="12.5" font-weight="800" letter-spacing="2">ELITES DENTAL · REGISTER</text><text x="867.3333333333334" y="178" fill="#F3F1EC" font-size="19" font-weight="800">Patients due for a check-up</text><text x="867.3333333333334" y="212" fill="#A8B0C4" font-size="13">Patients on file</text><rect x="867.3333333333334" y="220" width="221" height="16" rx="4" fill="#7B6FE0"/><text x="1096" y="234" fill="#F3F1EC" font-size="16" font-weight="800">796</text><text x="867.3333333333334" y="270" fill="#A8B0C4" font-size="13">Due for recall now</text><rect x="867.3333333333334" y="278" width="56" height="16" rx="4" fill="#1FA571"/><text x="932" y="292" fill="#F3F1EC" font-size="16" font-weight="800">203</text><text x="867.3333333333334" y="342" fill="#A8B0C4" font-size="13.5">87% visited once and never returned.</text><text x="867.3333333333334" y="364" fill="#6B7590" font-size="12.5">Fix: one-tap WhatsApp recall + partner QR card.</text></g></svg>