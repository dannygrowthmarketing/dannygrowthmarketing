<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="How I work: find, diagnose, fix, prove"><rect width="1280" height="300" rx="24" fill="#0C1222"/><g font-family="Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif"><text x="64" y="62" fill="#F3F1EC" font-size="26" font-weight="800">How an engagement runs</text><text x="64" y="90" fill="#A8B0C4" font-size="15">Same four stages for a salon, a jeweller, a resort or a clinic.</text><rect x="64.0" y="118" width="273.0" height="150" rx="16" fill="#131B33" stroke="#222C47"/><text x="84.0" y="152" fill="#7B6FE0" font-size="14" font-weight="800" letter-spacing="2">01</text><text x="120.0" y="153" fill="#F3F1EC" font-size="22" font-weight="800">Find</text><text x="84.0" y="180" fill="#A8B0C4" font-size="11.5" font-weight="700" letter-spacing=".8">PROBLEM · CUSTOMER · JOURNEY</text><text x="84.0" y="208" fill="#F3F1EC" fill-opacity=".85" font-size="14.5">Join sales, CRM and ad data.</text><text x="84.0" y="228" fill="#F3F1EC" fill-opacity=".85" font-size="14.5">Walk the customer path on a</text><text x="84.0" y="248" fill="#F3F1EC" fill-opacity=".85" font-size="14.5">phone.</text><path d="M341.0,193 l10,0 m-5,-5 l5,5 l-5,5" stroke="#A8B0C4" stroke-width="2" fill="none"/><rect x="357.0" y="118" width="273.0" height="150" rx="16" fill="#131B33" stroke="#222C47"/><text x="377.0" y="152" fill="#7B6FE0" font-size="14" font-weight="800" letter-spacing="2">02</text><text x="413.0" y="153" fill="#F3F1EC" font-size="22" font-weight="800">Diagnose</text><text x="377.0" y="180" fill="#A8B0C4" font-size="11.5" font-weight="700" letter-spacing=".8">DATA · LEAK · CAUSE</text><text x="377.0" y="208" fill="#F3F1EC" fill-opacity=".85" font-size="14.5">Find the step where money</text><text x="377.0" y="228" fill="#F3F1EC" fill-opacity=".85" font-size="14.5">stops. Say if it is not a</text><text x="377.0" y="248" fill="#F3F1EC" fill-opacity=".85" font-size="14.5">marketing problem.</text><path d="M634.0,193 l10,0 m-5,-5 l5,5 l-5,5" stroke="#A8B0C4" stroke-width="2" fill="none"/><rect x="650.0" y="118" width="273.0" height="150" rx="16" fill="#131B33" stroke="#222C47"/><text x="670.0" y="152" fill="#7B6FE0" font-size="14" font-weight="800" letter-spacing="2">03</text><text x="706.0" y="153" fill="#F3F1EC" font-size="22" font-weight="800">Fix</text><text x="670.0" y="180" fill="#A8B0C4" font-size="11.5" font-weight="700" letter-spacing=".8">BUILD · LAUNCH · TEST</text><text x="670.0" y="208" fill="#F3F1EC" fill-opacity=".85" font-size="14.5">Ads, Business Profile,</text><text x="670.0" y="228" fill="#F3F1EC" fill-opacity=".85" font-size="14.5">website, booking, CRM,</text><text x="670.0" y="248" fill="#F3F1EC" fill-opacity=".85" font-size="14.5">WhatsApp follow-up.</text><path d="M927.0,193 l10,0 m-5,-5 l5,5 l-5,5" stroke="#A8B0C4" stroke-width="2" fill="none"/><rect x="943.0" y="118" width="273.0" height="150" rx="16" fill="#131B33" stroke="#222C47"/><text x="963.0" y="152" fill="#1FA571" font-size="14" font-weight="800" letter-spacing="2">04</text><text x="999.0" y="153" fill="#F3F1EC" font-size="22" font-weight="800">Prove</text><text x="963.0" y="180" fill="#A8B0C4" font-size="11.5" font-weight="700" letter-spacing=".8">REVENUE · RETENTION · REPORT</text><text x="963.0" y="208" fill="#F3F1EC" fill-opacity=".85" font-size="14.5">Bills, bookings, orders. One</text><text x="963.0" y="228" fill="#F3F1EC" fill-opacity=".85" font-size="14.5">monthly CEO report, next 5</text><text x="963.0" y="248" fill="#F3F1EC" fill-opacity=".85" font-size="14.5">actions ranked.</text></g></svg>