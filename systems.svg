"14" opacity=".9">matched by phone code,</text><text x="595" y="352" text-anchor="middle" fill="#fff" font-size="14" opacity=".9">date and campaign</text><text x="595" y="382" text-anchor="middle" fill="#fff" font-size="12" opacity=".75">numbers never in the reports</text><path d="M720 330 H770" stroke="#A8B0C4" stroke-width="3"/><path d="M762 322 L774 330 L762 338" fill="none" stroke="#A8B0C4" stroke-width="3"/><rect x="786" y="235" width="200" height="190" rx="18" fill="#131B33" stroke="#222C47"/><text x="886" y="270" text-anchor="middle" fill="#F3F1EC" font-size="16" font-weight="800">Live dashboard</text><rect x="810" y="290" width="150" height="10" rx="5" fill="#7B6FE0"/><rect x="810" y="310" width="110" height="10" rx="5" fill="#1FA571"/><rect x="810" y="330" width="130" height="10" rx="5" fill="#FF6A6E"/><polyline points="810,400 842,380 874,388 906,358 936,366 962,342" fill="none" stroke="#9491FF" stroke-width="3"/><path d="M986 330 H1026" stroke="#A8B0C4" stroke-width="3"/><path d="M1018 322 L1030 330 L1018 338" fill="none" stroke="#A8B0C4" stroke-width="3"/><rect x="1042" y="210" width="168" height="52" rx="14" fill="#131B33" stroke="#222C47"/><text x="1058" y="232" fill="#F3F1EC" font-size="14.5" font-weight="700">Call back</text><text x="1058" y="250" fill="#A8B0C4" font-size="12">missed callers</text><rect x="1042" y="272" width="168" height="52" rx="14" fill="#131B33" stroke="#222C47"/><text x="1058" y="294" fill="#F3F1EC" font-size="14.5" font-weight="700">Move budget</text><text x="1058" y="312" fill="#A8B0C4" font-size="12">to what books</text><rect x="1042" y="334" width="168" height="52" rx="14" fill="#131B33" stroke="#222C47"/><text x="1058" y="356" fill="#F3F1EC" font-size="14.5" font-weight="700">Reply · recall</text><text x="1058" y="374" fill="#A8B0C4" font-size="12">reviews, patients</text><rect x="1042" y="396" width="168" height="52" rx="14" fill="#1FA571" stroke="#222C47"/><text x="1058" y="418" fill="#F3F1EC" font-size="14.5" font-weight="700">Monthly report</text><text x="1058" y="436" fill="#E6FFF4" font-size="12">budget, plan, proof</text><text x="64" y="536" fill="#6B7590" font-size="13">Live demo on sample data: dannygrowthmarketing.github.io/revenue-casebook/systems.html</text></g></svg>