<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-label="Connecting the dots: nine data sources (Google Ads, Meta Ads, website, Search Console, Business Profile, reviews, phone calls, sales CRM, patient register) flow into one database, a live dashboard, and actions: call back, move budget, reply and recall, monthly report"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#4B49D9"/><stop offset="1" stop-color="#0E9F6A"/></linearGradient></defs><rect width="1280" height="560" rx="24" fill="#0C1222"/><g font-family="Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif"><text x="64" y="62" fill="#F3F1EC" font-size="26" font-weight="800">Connecting the dots</text><text x="64" y="90" fill="#A8B0C4" font-size="15">Nine tools that never talk, wired into one database and one live dashboard. Built for a resort and a clinic, Oct 2026.</text><path d="M296 136 C 390 136, 390 330, 470 330" fill="none" stroke="#2A3556" stroke-width="2"/><rect x="64" y="120" width="232" height="32" rx="16" fill="#131B33" stroke="#222C47"/><circle cx="84" cy="136" r="5" fill="#9491FF"/><text x="98" y="141" fill="#F3F1EC" font-size="14" font-weight="600">Google Ads</text><path d="M296 182 C 390 182, 390 330, 470 330" fill="none" stroke="#2A3556" stroke-width="2"/><rect x="64" y="166" width="232" height="32" rx="16" fill="#131B33" stroke="#222C47"/><circle cx="84" cy="182" r="5" fill="#9491FF"/><text x="98" y="187" fill="#F3F1EC" font-size="14" font-weight="600">Meta Ads</text><path d="M296 228 C 390 228, 390 330, 470 330" fill="none" stroke="#2A3556" stroke-width="2"/><rect x="64" y="212" width="232" height="32" rx="16" fill="#131B33" stroke="#222C47"/><circle cx="84" cy="228" r="5" fill="#F0B53A"/><text x="98" y="233" fill="#F3F1EC" font-size="14" font-weight="600">Website (GA4)</text><path d="M296 274 C 390 274, 390 330, 470 330" fill="none" stroke="#2A3556" stroke-width="2"/><rect x="64" y="258" width="232" height="32" rx